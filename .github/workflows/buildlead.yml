name: Build IPA
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name"
        default: "Swiftgram"
        required: true
        type: choice
        options:
          - Telegram
          - Nicegram
          - Swiftgram
          - Turrit
          - Vartagram
          - Nagram

      bundle_id_override:
        description: "Optional installed bundle ID (e.g. ph.telegra.Telegraphx)"
        required: false
        type: string
        default: ""

      lead:
        description: "Inject Lead"
        type: boolean
        default: true
        required: true

      tgextra:
        description: "Inject TGExtra"
        type: boolean
        default: false
        required: true

      iqtele:
        description: "Inject iQTele"
        type: boolean
        default: false
        required: true

      privacy_controls:
        description: "Inject Privacy Controls (avatar, names, usernames, reactions)"
        type: boolean
        default: true
        required: true

      allow_unsafe_multi_tweak:
        description: "DANGEROUS: Allow multiple unverified tweaks (may crash at launch)"
        type: boolean
        default: false
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Guard against incompatible tweak combinations
        shell: bash
        run: |
          set -euo pipefail
          selected=()
          if [[ "${{ inputs.lead }}" == "true" ]]; then selected+=("Lead"); fi
          if [[ "${{ inputs.tgextra }}" == "true" ]]; then selected+=("TGExtra"); fi
          if [[ "${{ inputs.iqtele }}" == "true" ]]; then selected+=("iQTele"); fi
          if (( ${#selected[@]} > 1 )); then
            if [[ "${{ inputs.allow_unsafe_multi_tweak }}" != "true" ]]; then
              echo "::error::Crash isolation: multiple third-party tweaks selected (${selected[*]}). A Telegram 13.1.1 crash shows TGExtra calling through Lead on the MTProto queue. For safe testing select exactly ONE of Lead, TGExtra, iQTele; Privacy Controls can be independently enabled. To override this warning, explicitly enable allow_unsafe_multi_tweak (NOT recommended)."
              exit 1
            fi
            echo "::warning::Unsafe experimental build! Multiple third-party tweaks selected: ${selected[*]}. Telegram may crash at startup."
          fi

      - name: Resolve Bundle ID
        id: resolve
        env:
          CUSTOM_BUNDLE_ID: ${{ inputs.bundle_id_override }}
        run: |
          case "${{ inputs.display_name }}" in
            "Telegram")   BUNDLE_ID="ph.telegra.Telegraph" ;;
            "Nicegram")   BUNDLE_ID="app.nicegram" ;;
            "Swiftgram")  BUNDLE_ID="app.swiftgram.ios" ;;
            "Turrit")     BUNDLE_ID="com.seastar.turrit" ;;
            "Vartagram")  BUNDLE_ID="org.cpartisans.vartagram" ;;
            "Nagram")     BUNDLE_ID="xyz.nextalone.nagram" ;;
          esac
          if [[ -n "$CUSTOM_BUNDLE_ID" ]]; then
            if [[ ! "$CUSTOM_BUNDLE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
              echo "::error::Invalid bundle ID; use letters, digits, periods and hyphens."
              exit 1
            fi
            BUNDLE_ID="$CUSTOM_BUNDLE_ID"
          fi
          echo "Selected bundle ID: $BUNDLE_ID"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,lead,tgextra,iqtele,privacy_controls,allow_unsafe_multi_tweak

      - name: Download and Validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --quiet --no-verbose -O telegram.ipa
          file_type=$(file --mime-type -b telegram.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get App Version
        run: |
          unzip -q telegram.ipa -d tgextracted
          APP_PAYLOAD=$(find tgextracted/Payload/ -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [[ -z "$APP_PAYLOAD" ]]; then
            echo "::error::Could not find app bundle in Payload/"
            exit 1
          fi
          VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PAYLOAD/Info.plist")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          rm -rf tgextracted

      - name: Resolve Selected Tweaks
        run: |
          set -euo pipefail
          declare -a debs=()
          declare -a labels=()

          if [[ "${{ inputs.lead }}" == "true" ]]; then
            file=$(find resources -maxdepth 1 -name 'com.w3ltyyy.lead_*.deb' -print -quit)
            [[ -n "$file" ]] || { echo "::error::Lead package not found"; exit 1; }
            debs+=("$file")
            labels+=("Lead")
          fi
          if [[ "${{ inputs.tgextra }}" == "true" ]]; then
            file=$(find resources -maxdepth 1 -name 'com.choco.tgextra_*.deb' -print -quit)
            [[ -n "$file" ]] || { echo "::error::TGExtra package not found"; exit 1; }
            debs+=("$file")
            labels+=("TGExtra")
          fi
          if [[ "${{ inputs.iqtele }}" == "true" ]]; then
            file=$(find resources -maxdepth 1 -name 'iQTele_*_rootless.deb' -print -quit)
            [[ -n "$file" ]] || { echo "::error::iQTele package not found"; exit 1; }
            debs+=("$file")
            labels+=("iQTele")
          fi
          if [[ "${{ inputs.privacy_controls }}" == "true" ]]; then
            labels+=("Privacy")
          fi
          if [[ ${#labels[@]} -eq 0 ]]; then
            echo "::error::Select at least one tweak or Privacy Controls."
            exit 1
          fi
          {
            echo "SELECTED_DEBS=$(IFS=:; echo "${debs[*]}")"
            echo "TWEAK_VERSION=$(IFS=-; echo "${labels[*]}")"
          } >> "$GITHUB_ENV"
          printf 'Selected: %s\n' "${labels[*]}"

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos_cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}

      - name: Install Theos
        if: steps.theos_cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --recursive https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDK
        if: steps.theos_cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS18.6.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: |
          if ! command -v cyan &> /dev/null; then
            pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          fi

      - name: Clone and Build zxPluginsInject
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/royerlraph79/zxPluginsInject.git
          cd zxPluginsInject && make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:18.6:14.0
          mv .theos/obj/*.dylib ${{ github.workspace }}/zxPluginsInject.dylib

      - name: Build Privacy Controls tweak
        if: ${{ inputs.privacy_controls }}
        run: |
          make -C PrivacyControls FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:18.6:14.0

      - name: Inject Into IPA
        run: |
          shopt -s nullglob
          tweaks=("zxPluginsInject.dylib")
          if [[ -n "${{ env.SELECTED_DEBS }}" ]]; then
            IFS=: read -ra debs <<< "${{ env.SELECTED_DEBS }}"
            for deb in "${debs[@]}"; do
              [[ -n "$deb" ]] && tweaks+=("$deb")
            done
          fi
          if [[ "${{ inputs.privacy_controls }}" == "true" ]]; then
            privacy_dylib=$(find PrivacyControls/.theos/obj -name 'PrivacyControls.dylib' -type f -print -quit)
            [[ -n "$privacy_dylib" ]] || { echo "::error::Privacy Controls dylib not built"; exit 1; }
            tweaks+=("$privacy_dylib")
          fi
          for file in resources/*.dylib; do
            if [[ "$file" != "resources/SwiftgramCrack.dylib" ]]; then
              tweaks+=("$file")
            fi
          done
          if [ "${{ steps.resolve.outputs.bundle_id }}" = "app.swiftgram.ios" ]; then
            tweaks+=("resources/SwiftgramCrack.dylib")
          fi
          for t in "${tweaks[@]}"; do
            if [[ ! -f "$t" ]]; then
              echo "::error::Tweak file $t not found!"
              exit 1
            fi
          done
          cyan -i telegram.ipa \
            -o "${{ inputs.display_name }}_${{ env.APP_VERSION }}_${{ env.TWEAK_VERSION }}.ipa" \
            -f "${tweaks[@]}" \
            -n "${{ inputs.display_name }}" \
            -b "${{ steps.resolve.outputs.bundle_id }}"

      - name: Create a Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=1
          while gh release view "tg-ipa${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
            i=$(( i + 1 ))
          done
          gh release create "tg-ipa${i}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ inputs.display_name }}_${{ env.APP_VERSION }}_${{ env.TWEAK_VERSION }}" \
            --draft \
            ${{ inputs.display_name }}_${{ env.APP_VERSION }}_${{ env.TWEAK_VERSION }}.ipa

      - name: Job Summary - Build Complete
        run: echo -e '### 🛠️ Build IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Draft Release Link
        run: |
          echo -e "### 🚀 Draft Release\n\nDraft release has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY